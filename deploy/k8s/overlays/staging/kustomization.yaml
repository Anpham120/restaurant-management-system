# Staging: cụm máy 2 (in-cluster của Argo CD), namespace rms-staging. Đồng bộ từ nhánh develop.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rms-staging
resources:
  - namespace.yaml
  - ../../base
  - sealed-ghcr-pull.yaml
  - sealed-app-secrets.yaml
  - sealed-db-api.yaml
  - sealed-db-sepay.yaml
configMapGenerator:
  - name: rms-app-config
    behavior: merge
    literals:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - SEPAY_BANK_ACCOUNT=003120082006
      - SEPAY_BANK_NAME=MBBank
      # DB staging dựng mới từ 3 file SQL (chưa có bảng lịch sử Flyway): lập baseline version 1 rồi chạy V2+.
      # Profile prod ghi cứng baseline-on-migrate=false; biến SPRING_* ghi đè được (giống compose.staging.yaml).
      # Prod KHÔNG bật: DB production được nạp từ bản backup đã có lịch sử Flyway.
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
images:
  - name: ghcr.io/anpham120/rms-app
    newTag: a49970dab07afcb2f9f58222f1b4ba15d6338104
  - name: ghcr.io/anpham120/rms-web
    newTag: a49970dab07afcb2f9f58222f1b4ba15d6338104
# Staging nhỏ hơn: 1 bản app, 1 bản web, ổ DB 2 GiB
patches:
  - target: {kind: Rollout, name: rms-app}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment, name: rms-web}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Cluster, name: rms-db}
    patch: |-
      - {op: replace, path: /spec/storage/size, value: 2Gi}
