name: CI/CD

# P0-09: Jenkins (Jenkinsfile) is the CI/CD: it tests every pull request and deploys develop and main. These four
# test jobs stay only while the rulesets of develop and main still require them; once the rulesets require Jenkins'
# check instead (docs-core/11 section 11.4), this file goes.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Database-first: the ERD in docs-core/07-erd.md must match what the Flyway migrations create.
      - name: Check the ERD matches the migrations
        working-directory: .
        run: node scripts/check-erd.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on GitHub runners).
      - name: Build and test
        run: ./mvnw -B verify
      # P3-04: "Build and test" fails when the tests cover less than 70% of the lines (JaCoCo). The figure goes to
      # the run summary, the full HTML report to an artifact.
      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { printf "Độ phủ backend (JaCoCo): **%.1f%%** số dòng (%d/%d), tối thiểu 70%%\n",
                  100 * covered / (missed + covered), covered, missed + covered }' "$csv" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend - lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # P0-05: the acceptance scenario of docs-core/01 §1.5 in a real browser, against the whole app started with
  # Docker Compose. The pipeline goes red when the main flow breaks.
  e2e:
    name: E2E - acceptance scenario
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - name: Start the app
        working-directory: .
        run: docker compose up -d --build
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "The app did not start" >&2
          exit 1
      - run: npx playwright test
      - name: Show the backend log when something fails
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 200 backend
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report

  # P0-07: the monitoring server and agent configs parse, and every alert fires when it should (promtool test rules).
  # Images are the ones the compose files pin, so a Dependabot bump is checked with the new version.
  monitoring:
    name: Monitoring - check configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # P0-09: the same script the Jenkinsfile runs before it deploys.
      - name: Alert rules, Prometheus, Alertmanager, Alloy and Grafana configs
        run: sh scripts/check-monitoring.sh
