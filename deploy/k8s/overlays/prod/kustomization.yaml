# Production: cụm máy 1, namespace rms-prod. Argo CD đồng bộ thư mục này từ nhánh main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rms-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - middlewares.yaml
  - ingress-metrics.yaml
  - pdb.yaml
  - sealed-ghcr-pull.yaml
  - sealed-app-secrets.yaml
  - sealed-db-api.yaml
  - sealed-db-sepay.yaml
  - sealed-backup-s3.yaml
  - backup.yaml
  - db-metrics.yaml
configMapGenerator:
  - name: rms-app-config
    behavior: merge
    literals:
      - CORS_ALLOWED_ORIGINS=https://rms.atlasplatform12.tech
      - SEPAY_BANK_ACCOUNT=003120082006
      - SEPAY_BANK_NAME=MBBank
patches:
  # Sao lưu liên tục (chỉ production): plugin barman-cloud đẩy WAL lên SeaweedFS máy 2 (backup.yaml).
  # Thêm plugin vào Cluster làm pod DB khởi động lại một lần (thêm sidecar barman-cloud).
  - target: {kind: Cluster, name: rms-db}
    patch: |-
      # 2 bản PostgreSQL (primary + replica nhận WAL liên tục, cùng máy 1). Khi cần khởi động lại (đổi cấu hình, nâng cấp
      # phiên bản), CloudNativePG cập nhật replica trước rồi chuyển nó lên làm primary (switchover): gián đoạn vài giây
      # thay vì vài phút. Thêm replica không khởi động lại primary (replica sao chép bằng pg_basebackup).
      - {op: replace, path: /spec/instances, value: 2}
      - {op: add, path: /spec/primaryUpdateStrategy, value: unsupervised}
      - {op: add, path: /spec/primaryUpdateMethod, value: switchover}
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters: {barmanObjectName: rms-backup-store}
      # Đẩy WAL lên SeaweedFS chậm nhất mỗi 60 giây (mặc định CloudNativePG 5 phút): máy 1 hỏng hẳn thì mất tối đa
      # khoảng 1 phút dữ liệu cuối. Chỉ đổi file WAL khi có ghi mới, lúc nhàn rỗi không sinh thêm file. Đổi tham số này
      # chỉ cần nạp lại cấu hình (SIGHUP), PostgreSQL không khởi động lại.
      - op: add
        path: /spec/postgresql
        value:
          parameters: {archive_timeout: "60s"}
images:
  - name: ghcr.io/anpham120/rms-app
    newTag: bbd6b7561fa73ccf59ee79c2f5366ed4c2b5b771
  - name: ghcr.io/anpham120/rms-web
    newTag: bbd6b7561fa73ccf59ee79c2f5366ed4c2b5b771
