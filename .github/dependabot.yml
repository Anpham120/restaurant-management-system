# P0-06: weekly dependency updates as pull requests into develop (branch model: feature → develop → main).
# Minor and patch updates come grouped in one pull request per ecosystem to keep the noise down.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: develop
    schedule:
      interval: weekly

  # P0-07: images of the monitoring server and of the agent, pinned in their compose files.
  - package-ecosystem: docker-compose
    directories: [/deploy/ops, /deploy/agent]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      monitoring:
        patterns: ["*"]
