# Giám sát: Prometheus (thu thập số liệu + luật cảnh báo), Alertmanager (gửi Telegram), Grafana (hiển thị),
# node-exporter (CPU/RAM/đĩa máy chủ, thời điểm sao lưu), blackbox-exporter (gọi domain thật như người dùng).
# Vị trí (từ 20/11/2026): máy 2 chạy tất cả: cd /home/coder/rms-deploy/monitoring && docker compose up -d
#   máy 1 chỉ chạy node-exporter:            cd /home/coder/rms-deploy/monitoring && docker compose up -d node-exporter
# Máy 2 lấy số liệu app và node-exporter của máy 1 qua WireGuard (nginx máy 1, docs/devops/nginx/metrics-wireguard.conf).
# Bản clone trên máy 2 tự theo nhánh main bằng monitoring/sync/ (systemd timer, nạp lại Prometheus/Alertmanager).
# Chạy bằng network_mode: host, mọi cổng chỉ mở trên 127.0.0.1; Grafana ra ngoài qua nginx của máy 2.
# Cấu hình mount cả thư mục, không mount từng file: deploy cập nhật mã bằng git reset --hard (file mới, inode mới), bind mount
# một file sẽ vẫn trỏ bản cũ. scripts/deploy.sh gửi SIGHUP cho Prometheus và Alertmanager để nạp lại sau mỗi lần deploy.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    network_mode: host
    # Chạy bằng uid của chủ file token (coder) để file giữ quyền 600; trạng thái chỉ cần trong /tmp.
    # uid của coder khác nhau giữa các máy (máy 1: 1000, máy 2: 1001): đặt SECRETS_UID/SECRETS_GID trong monitoring/.env
    user: "${SECRETS_UID:-1000}:${SECRETS_GID:-1000}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
      - --storage.path=/tmp/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./secrets:/run/alertmanager-secrets:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      # scripts/backup-db.sh, offsite-backup.sh ghi rms_backup_last_success_timestamp_seconds vào đây (luật BackupStale)
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      # Mount thẳng thư mục con: /home/coder và rms-backups chỉ chủ sở hữu vào được, node-exporter chạy bằng nobody
      - ${BACKUP_DIR:-/home/coder/rms-backups}/metrics:/textfile:ro
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    network_mode: host
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox:/etc/blackbox_exporter:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Đặt GRAFANA_ADMIN_PASSWORD trong monitoring/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.atlasplatform12.tech/
      # Đăng nhập bằng GitHub (OAuth App của org atlas-platform12). Callback: https://grafana.atlasplatform12.tech/login/github
      # Client ID/secret nằm trong monitoring/.env (không vào Git), ghi bằng: bash scripts/set-github-oauth.sh grafana
      GF_AUTH_GITHUB_ENABLED: "true"
      GF_AUTH_GITHUB_CLIENT_ID: ${GRAFANA_GITHUB_CLIENT_ID:?Chạy bash scripts/set-github-oauth.sh grafana}
      GF_AUTH_GITHUB_CLIENT_SECRET: ${GRAFANA_GITHUB_CLIENT_SECRET:?Chạy bash scripts/set-github-oauth.sh grafana}
      GF_AUTH_GITHUB_SCOPES: user:email,read:org
      GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS: atlas-platform12
      GF_AUTH_GITHUB_ALLOW_SIGN_UP: "true"
      # Quyền theo team (nhóm GitHub dạng @org/team). Không thuộc team nào: biểu thức ra false, strict = từ chối đăng nhập
      GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH: >-
        contains(groups[*], '@atlas-platform12/rms-admins') && 'GrafanaAdmin' ||
        contains(groups[*], '@atlas-platform12/rms-developers') && 'Editor' ||
        contains(groups[*], '@atlas-platform12/rms-viewers') && 'Viewer'
      GF_AUTH_GITHUB_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GITHUB_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      # Tắt form mật khẩu và Basic auth: chỉ đăng nhập qua GitHub. Tài khoản admin vẫn còn để cứu hộ (xem tài liệu).
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
