# Tài khoản để Argo CD (máy 2) điều khiển cụm production (máy 1). Áp dụng trên máy 1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
# Argo CD cài cả thành phần nền tảng (CRD, namespace) nên cần quyền quản trị toàn cụm
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
---
# Token dài hạn gắn với ServiceAccount trên (Kubernetes tự điền token vào Secret này)
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
