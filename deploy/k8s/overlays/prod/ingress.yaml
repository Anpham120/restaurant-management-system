# Quy tắc định tuyến cho Traefik. nginx máy 1 giải mã HTTPS rồi chuyển vào Traefik (10.43.0.80) kèm Host gốc.
# Định tuyến ứng dụng chỉ nằm ở đây (nginx chuyển mọi request vào Traefik): /api và /actuator/health vào app,
# còn lại vào web.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rms
  annotations:
    # Header bảo mật + nén API (middlewares.yaml), tên dạng <namespace>-<tên>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: rms-prod-security-headers@kubernetescrd,rms-prod-compress@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: rms.atlasplatform12.tech
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: rms-app, port: {name: http}}}
          - path: /actuator/health
            pathType: Exact
            backend: {service: {name: rms-app, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: rms-web, port: {name: http}}}
