global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: rms-app
    metrics_path: /actuator/prometheus
    static_configs:
      # Slot A và slot B (blue-green, scripts/deploy.sh): bình thường chỉ một slot chạy, slot kia up = 0.
      # Nhãn application: dashboard JVM (Micrometer) lọc theo nhãn này.
      # Prometheus chạy ở máy 2: app trên máy 1 chỉ nghe 127.0.0.1, nên nginx máy 1 mở cổng 9181 (slot A, 8081) và
      # 9186 (slot B, 8086), chỉ cho 10.10.0.2 (máy 2) qua WireGuard (docs/devops/nginx/metrics-wireguard.conf).
      - targets: ['10.10.0.1:9181', '10.10.0.1:9186']
        labels: {application: restaurant-core}

  # Số liệu máy chủ của cả 2 máy. Nhãn instance đặt bằng tên máy để cảnh báo ghi rõ máy nào.
  - job_name: node
    static_configs:
      # máy 1: nginx 10.10.0.1:9200 -> node-exporter 127.0.0.1:9100
      - targets: ['10.10.0.1:9200']
        labels: {instance: may1-prod}
      # máy 2: node-exporter cùng máy
      - targets: ['127.0.0.1:9100']
        labels: {instance: may2-mgmt}

  # Kiểm từ phía người dùng qua blackbox-exporter (monitoring/blackbox/blackbox.yml): domain thật, nginx, HTTPS
  - job_name: site
    metrics_path: /probe
    scrape_interval: 30s
    static_configs:
      - targets: ['https://rms.atlasplatform12.tech/actuator/health']
        labels: {module: health}
      - targets: ['https://rms.atlasplatform12.tech/']
        labels: {module: web}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
