# Máy 1: /etc/nginx/sites-available/metrics-wireguard.conf (symlink sang sites-enabled).
# Cho Prometheus ở máy 2 (10.10.0.2, qua WireGuard) đọc số liệu của app và node-exporter, vốn chỉ nghe 127.0.0.1.
# Không nghe riêng 10.10.0.1: nếu wg0 chưa lên lúc khởi động, nginx sẽ không bind được và cả web production sập.
# Nghe mọi địa chỉ nhưng chỉ cho 10.10.0.2; ufw cũng không mở các cổng này ra internet (2 lớp chặn).
server {
    listen 9181;   # app slot A (blue-green) 127.0.0.1:8081
    allow 10.10.0.2;
    deny all;
    location = /actuator/prometheus { proxy_pass http://127.0.0.1:8081; }
    location / { return 404; }
}
server {
    listen 9186;   # app slot B 127.0.0.1:8086
    allow 10.10.0.2;
    deny all;
    location = /actuator/prometheus { proxy_pass http://127.0.0.1:8086; }
    location / { return 404; }
}
server {
    listen 9200;   # node-exporter 127.0.0.1:9100
    allow 10.10.0.2;
    deny all;
    location = /metrics { proxy_pass http://127.0.0.1:9100; }
    location / { return 404; }
}
