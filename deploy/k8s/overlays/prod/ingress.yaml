# Quy tắc định tuyến cho Traefik. nginx máy 1 giải mã HTTPS rồi chuyển vào Traefik (10.43.0.80) kèm Host gốc.
# Giống hệt nginx hiện tại: /api và /actuator/health vào app, còn lại vào web.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rms
spec:
  ingressClassName: traefik
  rules:
    - host: rms.atlasplatform12.tech
      http: &paths
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: rms-app, port: {name: http}}}
          - path: /actuator/health
            pathType: Exact
            backend: {service: {name: rms-app, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: rms-web, port: {name: http}}}
    # Tên miền phụ cho giai đoạn chạy song song (Phần 7)
    - host: k8s.rms.atlasplatform12.tech
      http: *paths
