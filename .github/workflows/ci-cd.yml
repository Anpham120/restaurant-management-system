name: CI/CD

# Branches: feature/* --PR--> develop --PR--> main.
# develop deploys to staging automatically; main deploys to production after approval.
# P0-08: Jenkins (Jenkinsfile) does the deploys; the images and deploy jobs here run only when cd-gate says that
# GitHub Actions must take over. Rolling back is .github/workflows/rollback.yml.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # "Run workflow" button in the Actions tab: runs the tests only (no images, no deploy).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Database-first: the ERD in docs-core/07-erd.md must match what the Flyway migrations create.
      - name: Check the ERD matches the migrations
        working-directory: .
        run: node scripts/check-erd.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on GitHub runners).
      - name: Build and test
        run: ./mvnw -B verify
      # P3-04: "Build and test" fails when the tests cover less than 70% of the lines (JaCoCo). The figure goes to
      # the run summary, the full HTML report to an artifact.
      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { printf "Độ phủ backend (JaCoCo): **%.1f%%** số dòng (%d/%d), tối thiểu 70%%\n",
                  100 * covered / (missed + covered), covered, missed + covered }' "$csv" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend - lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # P0-05: the acceptance scenario of docs-core/01 §1.5 in a real browser, against the whole app started with
  # Docker Compose. The pipeline goes red when the main flow breaks.
  e2e:
    name: E2E - acceptance scenario
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - name: Start the app
        working-directory: .
        run: docker compose up -d --build
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "The app did not start" >&2
          exit 1
      - run: npx playwright test
      - name: Show the backend log when something fails
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 200 backend
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report

  # P0-07: the monitoring server and agent configs parse, and every alert fires when it should (promtool test rules).
  # Images are the ones the compose files pin, so a Dependabot bump is checked with the new version.
  monitoring:
    name: Monitoring - check configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the image versions from the compose files
        run: |
          image() { grep -m1 "image: $1:" "$2" | awk '{print $2}'; }
          echo "PROMETHEUS=$(image prom/prometheus deploy/ops/docker-compose.yml)" >> "$GITHUB_ENV"
          echo "ALERTMANAGER=$(image prom/alertmanager deploy/ops/docker-compose.yml)" >> "$GITHUB_ENV"
          echo "ALLOY=$(image grafana/alloy deploy/agent/docker-compose.yml)" >> "$GITHUB_ENV"
      - name: Alert rules and their tests
        run: |
          docker run --rm -v "$PWD/deploy/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROMETHEUS" \
            check rules /etc/prometheus/rules/khoibep.yml
          docker run --rm -v "$PWD/deploy/ops/prometheus:/etc/prometheus:ro" -w /etc/prometheus/tests \
            --entrypoint promtool "$PROMETHEUS" test rules khoibep_test.yml
      - name: Prometheus config
        run: |
          sed -e 's|__SITE_URL_PRODUCTION__|https://example.com/actuator/health|' \
            -e 's|__SITE_URL_STAGING__|https://staging.example.com/actuator/health|' \
            deploy/ops/prometheus/prometheus.yml > "$RUNNER_TEMP/prometheus.yml"
          docker run --rm -v "$RUNNER_TEMP/prometheus.yml:/tmp/prometheus.yml:ro" \
            -v "$PWD/deploy/ops/prometheus/rules:/etc/prometheus/rules:ro" --entrypoint promtool "$PROMETHEUS" \
            check config /tmp/prometheus.yml
      - name: Alertmanager config
        run: |
          sed -e 's|__TELEGRAM_BOT_TOKEN__|123456789:ci|' -e 's|__TELEGRAM_CHAT_ID__|-1001|' \
            deploy/ops/alertmanager/alertmanager.yml > "$RUNNER_TEMP/alertmanager.yml"
          docker run --rm -v "$RUNNER_TEMP/alertmanager.yml:/tmp/alertmanager.yml:ro" \
            -v "$PWD/deploy/ops/alertmanager:/etc/alertmanager:ro" --entrypoint amtool "$ALERTMANAGER" \
            check-config /tmp/alertmanager.yml
      - name: Alloy config
        run: |
          docker run --rm -v "$PWD/deploy/agent/config.alloy:/etc/alloy/config.alloy:ro" "$ALLOY" \
            validate /etc/alloy/config.alloy
      - name: Grafana dashboards are valid JSON
        run: jq empty deploy/ops/grafana/dashboards/*.json

  # P0-08: Jenkins deploys first and reports "jenkins/deploy" on the commit. This job waits for it and decides whether
  # GitHub Actions takes over (scripts/cd-gate.sh): no Jenkins set up (no JENKINS_URL), Jenkins not answering, or
  # silent about this commit for 5 minutes. A failure Jenkins reports stops here: Actions does not deploy over it.
  cd-gate:
    name: CD - Jenkins or Actions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      statuses: read
    outputs:
      takeover: ${{ steps.gate.outputs.takeover }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for Jenkins
        id: gate
        env:
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/cd-gate.sh
      - name: Tell Telegram that GitHub Actions deploys instead of Jenkins
        if: steps.gate.outputs.takeover == 'true' && vars.JENKINS_URL != '' && vars.DEPLOY_ENABLED == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          curl -fsS -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🟠 $GITHUB_REF_NAME ${GITHUB_SHA::7}: $REASON" || true

  # Pushes to main get the moving tag "latest", pushes to develop get "develop"; every image also
  # gets the commit sha, which is what the deploy job runs. Only when GitHub Actions deploys (cd-gate).
  images:
    name: Build and push images
    needs: [backend, frontend, cd-gate]
    if: github.event_name == 'push' && needs.cd-gate.outputs.takeover == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      CHANNEL: ${{ github.ref_name == 'main' && 'latest' || 'develop' }}
    steps:
      - uses: actions/checkout@v7
      - name: GHCR needs a lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/rms-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/rms-backend:${{ env.CHANNEL }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/rms-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/rms-frontend:${{ env.CHANNEL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # P0-06: report known vulnerabilities in both images under Security → Code scanning. Reports only,
      # never fails the build. The third-party action is pinned to a commit, not a movable tag.
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/rms-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/rms-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload the backend image scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload the frontend image scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # develop → environment "staging" (no approval), main → environment "production" (add required
  # reviewers in GitHub settings). Each environment holds its own DEPLOY_* secrets and PUBLIC_URL.
  # Nothing is deployed until the repository variable DEPLOY_ENABLED is "true".
  deploy:
    # Static name: GitHub does not evaluate expressions in the name of a skipped job.
    name: Deploy
    needs: images
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ github.ref_name == 'main' && 'khoibep-rms' || 'khoibep-rms-staging' }}
    steps:
      - uses: actions/checkout@v7
      # P0-08: a newer commit of the branch deploys itself; this one must not land after it.
      - name: Newest commit of the branch only
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME already has a newer commit ($head), which deploys itself"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy the compose file and the scripts to the server
        if: steps.head.outputs.skip != 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/backup.sh,deploy/restore.sh,deploy/deploy.sh
          target: ${{ env.APP_DIR }}
          strip_components: 1
      # deploy.sh is the same script Jenkins runs: one deploy at a time on the server, whoever starts it.
      - name: Pull the new images and restart
        if: steps.head.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sh ~/${{ env.APP_DIR }}/deploy.sh ${{ env.APP_DIR }} ${{ github.sha }}
            status=$?
            docker logout ghcr.io
            exit $status
      - name: Check the new version answers
        if: steps.head.outputs.skip != 'true'
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "${{ vars.PUBLIC_URL }}/actuator/health"; then exit 0; fi
            sleep 5
          done
          echo "Health check failed. Roll back: Actions → Rollback → Run workflow." >&2
          exit 1
