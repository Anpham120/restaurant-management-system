# Máy 2: /etc/nginx/sites-available/s3-wireguard.conf (symlink sang sites-enabled).
# Cổng S3 (SeaweedFS 127.0.0.1:8333) cho CloudNativePG ở máy 1 (10.10.0.1, qua WireGuard) ghi bản sao lưu.
# Nghe mọi địa chỉ nhưng chỉ cho 10.10.0.1; ufw cũng không mở 9000 ra internet (2 lớp chặn).
server {
    listen 9000;
    allow 10.10.0.1;
    deny all;
    # Không giới hạn kích thước, không đệm: bản sao lưu nền có thể lớn, ghi thẳng sang SeaweedFS
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    location / {
        # Giữ nguyên Host: chữ ký S3 (SigV4) tính trên Host mà client gửi
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:8333;
    }
}
