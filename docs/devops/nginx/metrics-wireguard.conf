# Máy 1: /etc/nginx/sites-available/metrics-wireguard.conf (symlink sang sites-enabled).
# Cho Prometheus ở máy 2 (10.10.0.2, qua WireGuard) đọc số liệu của app (trong Kubernetes) và node-exporter (chỉ nghe 127.0.0.1).
# Không nghe riêng 10.10.0.1: nếu wg0 chưa lên lúc khởi động, nginx sẽ không bind được và cả web production sập.
# Nghe mọi địa chỉ nhưng chỉ cho 10.10.0.2; ufw cũng không mở các cổng này ra internet (2 lớp chặn).
server {
    listen 9181;   # app Kubernetes rms-prod: Traefik 10.43.0.80, Ingress rms-metrics (Host rms-metrics.internal)
    allow 10.10.0.2;
    deny all;
    location = /actuator/prometheus {
        proxy_set_header Host rms-metrics.internal;
        proxy_pass http://10.43.0.80;
    }
    location / { return 404; }
}
server {
    listen 9200;   # node-exporter 127.0.0.1:9100
    allow 10.10.0.2;
    deny all;
    location = /metrics { proxy_pass http://127.0.0.1:9100; }
    location / { return 404; }
}
