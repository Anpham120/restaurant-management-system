# Phục vụ SPA: đường dẫn không phải file (/tables, /orders/12…) trả index.html để React Router xử lý.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # file có hash trong tên → cache lâu; index.html luôn lấy bản mới để nhận bản build mới ngay
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
