name: CodeQL

# P0-06: static analysis of the Java and TypeScript code. Findings show under Security → Code scanning.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "30 20 * * 0" # Monday 03:30 in Vietnam, for new queries on unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL - ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # language is CodeQL's own id: java-kotlin is its one analyzer for Java and Kotlin (this project has only
        # Java), javascript-typescript reads the TypeScript frontend. name is what the check is called on GitHub.
        include:
          - language: java-kotlin
            name: Java
          - language: javascript-typescript
            name: TypeScript
    steps:
      - uses: actions/checkout@v7
      # No build needed: CodeQL reads the Java and TypeScript sources directly.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
