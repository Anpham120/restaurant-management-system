# Bài kiểm tra trước khi chuyển khách sang bản mới: gọi health readiness qua Service preview.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: rms-smoke
spec:
  args:
    - name: service-name
  metrics:
    - name: readiness
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: rms-smoke
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  seccompProfile: {type: RuntimeDefault}
                containers:
                  - name: smoke
                    image: curlimages/curl:8.11.1
                    args:
                      - -fsS
                      - --retry
                      - "10"
                      - --retry-delay
                      - "3"
                      - --retry-all-errors
                      - http://{{args.service-name}}:8081/actuator/health/readiness
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: {drop: [ALL]}
