# Restaurant Core — nginx máy chủ. Cài: /etc/nginx/sites-available/rms.atlasplatform12.tech.conf (xem docs/devops/PIPELINE.md §3.7–3.8).
#   "/"      → frontend: container web (slot A, 127.0.0.1:8083) hoặc web-b (slot B, 127.0.0.1:8087)
#   "/api/"  → backend:  container app (slot A, 127.0.0.1:8081) hoặc app-b (slot B, 127.0.0.1:8086)
# Blue-green (scripts/deploy.sh): bình thường chỉ một slot chạy. Slot đang dừng từ chối kết nối ngay, nginx chuyển request
# sang slot còn lại (proxy_next_upstream error) nên người dùng không thấy lỗi. deploy.sh nhận ra chế độ blue-green
# bằng cách tìm "127.0.0.1:8086" trong file này.

upstream rms_app {
    server 127.0.0.1:8081 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8086 max_fails=1 fail_timeout=5s;
}

upstream rms_web {
    server 127.0.0.1:8083 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8087 max_fails=1 fail_timeout=5s;
}

server {
    server_name rms.atlasplatform12.tech;

    client_max_body_size 1m;

    # Slot đang dừng: thử slot kia. Lỗi kết nối xảy ra trước khi gửi request nên POST cũng được chuyển an toàn.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;
    # Bắt buộc ở mức server: thiếu thì Host gửi đi là tên upstream "rms_app" (có dấu _) và Tomcat trả 400
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Chống dò mật khẩu theo IP (zone rms_login: /etc/nginx/conf.d/rms-login-ratelimit.conf); vượt giới hạn trả 429
    location = /api/auth/login {
        limit_req zone=rms_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://rms_app;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://rms_app;
        proxy_read_timeout 30s;
    }

    location = /actuator/health {
        proxy_pass http://rms_app;
    }

    location / {
        proxy_pass http://rms_web;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rms.atlasplatform12.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rms.atlasplatform12.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = rms.atlasplatform12.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name rms.atlasplatform12.tech;
    return 404; # managed by Certbot


}
