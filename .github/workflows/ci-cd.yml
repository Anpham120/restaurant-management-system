name: CI/CD

# Branches: feature/* --PR--> develop --PR--> main.
# develop deploys to staging automatically; main deploys to production after approval.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # "Run workflow" button in the Actions tab: runs the tests only (no images, no deploy).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Database-first: the ERD in docs-core/07-erd.md must match what the Flyway migrations create.
      - name: Check the ERD matches the migrations
        working-directory: .
        run: node scripts/check-erd.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on GitHub runners).
      - name: Build and test
        run: ./mvnw -B verify
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend - lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # P0-05: the acceptance scenario of docs-core/01 §1.5 in a real browser, against the whole app started with
  # Docker Compose. The pipeline goes red when the main flow breaks.
  e2e:
    name: E2E - acceptance scenario
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - name: Start the app
        working-directory: .
        run: docker compose up -d --build
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "The app did not start" >&2
          exit 1
      - run: npx playwright test
      - name: Show the backend log when something fails
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 200 backend
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report

  # Pushes to main get the moving tag "latest", pushes to develop get "develop"; every image also
  # gets the commit sha, which is what the deploy job runs.
  images:
    name: Build and push images
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      CHANNEL: ${{ github.ref_name == 'main' && 'latest' || 'develop' }}
    steps:
      - uses: actions/checkout@v7
      - name: GHCR needs a lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/rms-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/rms-backend:${{ env.CHANNEL }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/rms-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/rms-frontend:${{ env.CHANNEL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # P0-06: report known vulnerabilities in both images under Security → Code scanning. Reports only,
      # never fails the build. The third-party action is pinned to a commit, not a movable tag.
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/rms-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/rms-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload the backend image scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload the frontend image scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # develop → environment "staging" (no approval), main → environment "production" (add required
  # reviewers in GitHub settings). Each environment holds its own DEPLOY_* secrets and PUBLIC_URL.
  # Nothing is deployed until the repository variable DEPLOY_ENABLED is "true".
  deploy:
    # Static name: GitHub does not evaluate expressions in the name of a skipped job.
    name: Deploy
    needs: images
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ github.ref_name == 'main' && 'bnn-rms' || 'bnn-rms-staging' }}
    steps:
      - uses: actions/checkout@v7
      - name: GHCR needs a lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Copy compose file to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: ${{ env.APP_DIR }}
          strip_components: 1
      - name: Pull the new images and restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE_TAG=${{ github.sha }} GHCR_OWNER=${{ env.OWNER }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker logout ghcr.io
            docker image prune -f
      - name: Check the new version answers
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "${{ vars.PUBLIC_URL }}/actuator/health"; then exit 0; fi
            sleep 5
          done
          echo "Health check failed. Roll back: re-run this job from the last good run." >&2
          exit 1
