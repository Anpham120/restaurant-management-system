# Production: cụm máy 1, namespace rms-prod. Argo CD đồng bộ thư mục này từ nhánh main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rms-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - ingress-metrics.yaml
  - pdb.yaml
  - sealed-ghcr-pull.yaml
  - sealed-app-secrets.yaml
  - sealed-db-api.yaml
  - sealed-db-sepay.yaml
  - sealed-backup-s3.yaml
  - backup.yaml
  - db-metrics.yaml
configMapGenerator:
  - name: rms-app-config
    behavior: merge
    literals:
      - CORS_ALLOWED_ORIGINS=https://rms.atlasplatform12.tech,https://k8s.rms.atlasplatform12.tech
      - SEPAY_BANK_ACCOUNT=003120082006
      - SEPAY_BANK_NAME=MBBank
# Giai đoạn chạy song song (Phần 7): 1 bản app vì máy 1 còn chạy Jenkins và production cũ.
# Nâng lên 2 sau khi chuyển hẳn (xóa patch này).
patches:
  # Sao lưu liên tục (chỉ production): plugin barman-cloud đẩy WAL lên SeaweedFS máy 2 (backup.yaml).
  # Thêm plugin vào Cluster làm pod DB khởi động lại một lần (thêm sidecar barman-cloud).
  - target: {kind: Cluster, name: rms-db}
    patch: |-
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters: {barmanObjectName: rms-backup-store}
images:
  - name: ghcr.io/anpham120/rms-app
    newTag: f1ee69a366a46bc6c2bed6e0e1025da2567e30fc
  - name: ghcr.io/anpham120/rms-web
    newTag: f1ee69a366a46bc6c2bed6e0e1025da2567e30fc
