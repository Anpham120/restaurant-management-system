# Số liệu PostgreSQL do CloudNativePG xuất ở cổng 9187 của pod DB (gồm trạng thái đẩy WAL lên SeaweedFS).
# Đường đi: Prometheus máy 2 -> nginx máy 1 cổng 9182 -> Traefik (Host rms-metrics.internal, /metrics) -> Service này -> pod primary.
apiVersion: v1
kind: Service
metadata:
  name: rms-db-metrics
spec:
  selector:
    cnpg.io/cluster: rms-db
    cnpg.io/instanceRole: primary
  ports:
    - {name: metrics, port: 9187, targetPort: 9187}
---
# Bổ sung cho allow-db (các NetworkPolicy cộng dồn): chỉ Traefik được gọi cổng số liệu 9187
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-metrics
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: rms-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {port: 9187, protocol: TCP}
