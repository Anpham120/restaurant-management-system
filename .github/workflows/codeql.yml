name: CodeQL

# P0-06: static analysis of the Java and TypeScript code. Findings show under Security → Code scanning.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "30 20 * * 0" # Monday 03:30 in Vietnam, for new queries on unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      # No build needed: CodeQL reads the Java and TypeScript sources directly.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
