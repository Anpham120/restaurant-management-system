# Luật cảnh báo. Prometheus đánh giá mỗi 15 giây; "for" là thời gian phải vi phạm liên tục mới bắn,
# để tránh báo nhầm khi app khởi động lại (deploy) vài chục giây.
groups:
  # Nhịp tim (dead man's switch): luôn bật. Alertmanager gửi nó ra healthchecks.io mỗi phút (receiver heartbeat).
  # Prometheus, Alertmanager, mạng hoặc cả máy chủ chết thì nhịp tim dừng, healthchecks.io báo qua Telegram/email.
  - name: meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "Nhịp tim giám sát (luôn bật, không phải sự cố)"

  - name: rms
    rules:
      - alert: AppDown
        # Hai slot blue-green: chỉ báo khi KHÔNG slot nào phản hồi (slot đang dừng luôn up = 0)
        expr: max(up{job="rms-app"}) == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Ứng dụng RMS không phản hồi"
          description: "Prometheus không lấy được số liệu từ app trong hơn 1 phút."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Tỉ lệ lỗi 5xx trên 5%"
          description: "Hơn 5% request trả lỗi máy chủ trong 5 phút gần nhất."

      - alert: JvmHeapHigh
        # Tính riêng từng slot. Mẫu số chỉ lấy vùng có giới hạn (G1 Eden/Survivor báo max = -1; Old Gen max = -Xmx)
        expr: |
          sum by (instance) (jvm_memory_used_bytes{area="heap"})
            / sum by (instance) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Bộ nhớ heap JVM trên 90%"
          description: "App có thể sắp hết bộ nhớ (rò rỉ hoặc tải cao)."

  # Kiểm từ phía người dùng (blackbox-exporter gọi domain thật mỗi 30 giây)
  - name: site
    rules:
      - alert: SiteDown
        expr: probe_success{job="site"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Người dùng không vào được {{ $labels.instance }}"
          description: "Gọi qua domain thật (nginx + HTTPS) thất bại hơn 2 phút: database chết (health DOWN), nginx, DNS hoặc chứng chỉ lỗi."

      - alert: CertExpiringSoon
        expr: (min by (instance) (probe_ssl_earliest_cert_expiry{job="site"}) - time()) / 86400 < 14
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Chứng chỉ HTTPS còn dưới 14 ngày"
          description: "certbot chưa gia hạn được. Kiểm: sudo certbot renew --dry-run; systemctl status certbot.timer"

      - alert: ProbeExporterDown
        expr: up{job="site"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "blackbox-exporter không phản hồi"
          description: "Không kiểm được domain từ phía người dùng (SiteDown sẽ không báo được)."

  # Sao lưu: backup-db.sh và offsite-backup.sh ghi thời điểm thành công vào textfile collector của node-exporter
  - name: backup
    rules:
      - alert: BackupStale
        expr: |
          (time() - rms_backup_last_success_timestamp_seconds{kind="daily"}) > 26 * 3600
            or absent(rms_backup_last_success_timestamp_seconds{kind="daily"})
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "Quá 26 giờ không có bản sao lưu database mới"
          description: "Cron backup-db.sh daily (02:30 giờ VN) không chạy hoặc lỗi. Xem /home/coder/rms-backups/backup.log"

      - alert: OffsiteBackupStale
        expr: |
          (time() - rms_backup_last_success_timestamp_seconds{kind="offsite"}) > 26 * 3600
            or absent(rms_backup_last_success_timestamp_seconds{kind="offsite"})
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Quá 26 giờ chưa gửi bản sao lưu ra ngoài máy chủ"
          description: "Cron offsite-backup.sh (02:35 giờ VN) lỗi: thiếu khóa, token Telegram hoặc mạng. Xem /home/coder/rms-backups/backup.log"

  - name: host
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Mất số liệu máy chủ"
          description: "node-exporter không phản hồi, không theo dõi được CPU, RAM, ổ đĩa."

      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Ổ đĩa còn dưới 15%"
          description: "Phân vùng gốc sắp đầy, pipeline và database có thể lỗi."

      - alert: HighMemory
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "RAM máy chủ trên 90%"
          description: "RAM khả dụng thấp liên tục trong 10 phút."

      - alert: HighCpu
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "CPU máy chủ trên 90%"
          description: "CPU quá tải liên tục trong 10 phút."
