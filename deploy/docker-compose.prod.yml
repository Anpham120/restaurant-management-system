# Staging and production: images come from GHCR, secrets from the .env file next to this file
# (never from Git). The pipeline copies this file to ~/khoibep-rms (production) or ~/khoibep-rms-staging
# (staging) and runs: IMAGE_TAG=<commit sha> docker compose up -d. The folder name keeps the two
# stacks' containers and volumes apart.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rms
      POSTGRES_USER: rms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms -d rms"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/rms-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Production and staging share a 2 GB server: the JVM takes 75% of this limit for its heap.
    mem_limit: ${BACKEND_MEMORY:-768m}
    environment:
      DB_URL: jdbc:postgresql://db:5432/rms
      DB_USERNAME: rms
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      SEPAY_API_KEY: ${SEPAY_API_KEY:?set SEPAY_API_KEY in .env}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?set APP_PUBLIC_BASE_URL in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_BASE_URL}
      APP_DEMO_ACCOUNTS_ENABLED: ${APP_DEMO_ACCOUNTS_ENABLED:-false}
      APP_DEMO_ACCOUNTS_PASSWORD: ${APP_DEMO_ACCOUNTS_PASSWORD:-123456}
      # BR-48: the first admin of a new production database; remove it from .env after the first sign-in.
      APP_INITIAL_ADMIN_USERNAME: ${APP_INITIAL_ADMIN_USERNAME:-admin}
      APP_INITIAL_ADMIN_PASSWORD: ${APP_INITIAL_ADMIN_PASSWORD:-}
      SPRINGDOC_APIDOCS_ENABLED: "false"
      SPRINGDOC_SWAGGERUI_ENABLED: "false"
      # NFR-11: one JSON object per log line (Elastic Common Schema), for jq or a log collector.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # NFR-12: the monitoring agent reads /actuator/prometheus with this token; empty keeps it shut.
      APP_METRICS_TOKEN: ${APP_METRICS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GHCR_OWNER}/rms-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Caddy (deploy/caddy) puts HTTPS in front and reaches this port on 127.0.0.1: production 8081, staging
      # 8080. SePay needs a public HTTPS address. Without a proxy on this server, HTTP_BIND=0.0.0.0 opens it.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8081}:80"

  # P0-04: a dump of the database every night at BACKUP_HOUR (Vietnam time), the newest BACKUP_KEEP kept in
  # ./backups next to this file. Restore with restore.sh. Copy ./backups off the server now and then as well:
  # a lost server takes its backups with it.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: rms
      PGDATABASE: rms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
