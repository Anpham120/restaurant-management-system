global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: rms-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8081']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
