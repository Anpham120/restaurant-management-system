# Kho đối tượng S3 cho sao lưu CloudNativePG (WAL liên tục + bản sao lưu nền). Chạy ở máy 2: /opt/seaweedfs.
# SeaweedFS thay MinIO: MinIO đã ngừng phát hành bản cộng đồng (không còn image sau 2025, không có bản vá bảo mật).
# Chỉ mở cổng S3 trên 127.0.0.1:8333; nginx máy 2 cổng 9000 chuyển vào, chỉ cho 10.10.0.1 (máy 1) qua WireGuard
# (docs/devops/nginx/s3-wireguard.conf). Khóa truy cập nằm trong /opt/seaweedfs/s3.json (quyền 600, không vào Git).
# Chạy: cd /opt/seaweedfs && docker compose up -d
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs
    # master + volume + filer + cổng S3 trong một tiến trình (đủ cho 1 máy); dữ liệu ở /data
    command: >-
      server -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 512m
    restart: unless-stopped

volumes:
  # /var/lib/docker/volumes/seaweedfs_seaweedfs-data/_data
  seaweedfs-data:
