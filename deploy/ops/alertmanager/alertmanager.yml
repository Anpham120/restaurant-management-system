# P0-07, NFR-12: every alert goes to one Telegram group, grouped by alert, environment and server; a message again
# every 4 hours while it lasts, and one when it is over. start.sh puts the bot token and chat id from .env in.
route:
  receiver: telegram
  group_by: [alertname, env, server]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: HTML
        send_resolved: true
        message: '{{ template "khoibep.telegram" . }}'

templates:
  - /etc/alertmanager/telegram.tmpl
