# Staging and production: images come from GHCR, secrets from the .env file next to this file
# (never from Git). The pipeline copies this file to ~/bnn-rms (production) or ~/bnn-rms-staging
# (staging) and runs: IMAGE_TAG=<commit sha> docker compose up -d. The folder name keeps the two
# stacks' containers and volumes apart.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rms
      POSTGRES_USER: rms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms -d rms"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/rms-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/rms
      DB_USERNAME: rms
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      SEPAY_API_KEY: ${SEPAY_API_KEY:?set SEPAY_API_KEY in .env}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?set APP_PUBLIC_BASE_URL in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_BASE_URL}
      APP_DEMO_ACCOUNTS_ENABLED: ${APP_DEMO_ACCOUNTS_ENABLED:-false}
      SPRINGDOC_APIDOCS_ENABLED: "false"
      SPRINGDOC_SWAGGERUI_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GHCR_OWNER}/rms-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Put HTTPS in front (Caddy or Cloudflare Tunnel); SePay needs a public HTTPS address.
      # Staging on the same server uses another port, e.g. HTTP_PORT=8080.
      - "${HTTP_PORT:-80}:80"

  # P0-04: a dump of the database every night at BACKUP_HOUR (Vietnam time), the newest BACKUP_KEEP kept in
  # ./backups next to this file. Restore with restore.sh. Copy ./backups off the server now and then as well:
  # a lost server takes its backups with it.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: rms
      PGDATABASE: rms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
