name: Load test

# P3-03 (NFR-02): 30 people at once for 2 minutes against the whole app started with Docker Compose, after
# loading six months of past sales. Run it from the Actions tab before a demo or a release. It fails when the API
# answers 5% of requests slower than 500 ms, or when more than 1% of requests fail.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    name: Load test - 30 users
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the app
        run: docker compose up -d --build
      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "The app did not start" >&2
          exit 1
      - name: Load six months of past sales
        run: docker compose exec -T db psql -U rms -d rms -v ON_ERROR_STOP=1 -q < perf/seed-history.sql
      - name: Run k6
        run: |
          set -o pipefail
          docker run --rm --network host -v "$PWD/perf:/perf" grafana/k6:2.3.0 run --no-color \
            -e BASE_URL=http://localhost:8080 /perf/load-test.js | tee k6-summary.txt
      - name: Show the thresholds in the run summary
        if: always()
        run: |
          [ -f k6-summary.txt ] || exit 0
          { echo '```'; sed -n '/THRESHOLDS/,/TOTAL RESULTS/p' k6-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the full result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test
          path: k6-summary.txt
          if-no-files-found: ignore
