# P0-07, NFR-12. The application server pushes its numbers here (remote write, see deploy/agent); Prometheus itself
# only reads this server and calls the two sites from outside. start.sh puts the site addresses and targets in.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          server: ops

  # This server's own node exporter. start.sh writes the list: none on a single server (P0-09), where the agent
  # already reads the machine.
  - job_name: node
    file_sd_configs:
      - files: ["/prometheus/targets/*.yml"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          server: ops

  # The restaurant as a customer reaches it: over the Internet, from outside the application server (SiteDown).
  - job_name: site
    metrics_path: /probe
    params:
      module: [health]
    static_configs:
      - targets: ["__SITE_URL_PRODUCTION__"]
        labels:
          env: production
      - targets: ["__SITE_URL_STAGING__"]
        labels:
          env: staging
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
