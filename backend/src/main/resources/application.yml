spring:
  application:
    name: rms
  datasource:
    # Default matches the db service of docker-compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:55432/rms}
    username: ${DB_USERNAME:rms}
    password: ${DB_PASSWORD:rms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # No hibernate.jdbc.time_zone: every point in time is TIMESTAMPTZ, which is stored as UTC anyway, and that
    # setting would shift TIME columns (work_shift) by the JVM zone's 1970 offset on machines not set to UTC.

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # health is public; info and metrics are for ADMIN only, prometheus for APP_METRICS_TOKEN only (SecurityConfig).
        # Nginx forwards none of them but health (NFR-11, NFR-12).
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      # NFR-02, NFR-12: enough buckets for the p95-over-500-ms alert, without a full histogram per URI.
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: Asia/Ho_Chi_Minh
  jwt:
    # Dev default only. Production must set APP_JWT_SECRET (at least 32 characters).
    secret: ${APP_JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
    ttl: 12h
  sepay:
    api-key: ${SEPAY_API_KEY:dev-sepay-key}
  # Base URL printed into table QR codes, e.g. https://khoibep.example.vn
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  # Tokens travel in headers, never cookies, so allowing other origins does not expose sessions.
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  demo-accounts:
    enabled: ${APP_DEMO_ACCOUNTS_ENABLED:false}
    password: ${APP_DEMO_ACCOUNTS_PASSWORD:123456}
  # BR-48: the first admin of a new database when demo accounts are off (production); ignored once anyone exists.
  initial-admin:
    username: ${APP_INITIAL_ADMIN_USERNAME:admin}
    password: ${APP_INITIAL_ADMIN_PASSWORD:}
  # NFR-11, NFR-12: the Bearer token Alloy sends to read /actuator/prometheus; empty keeps the endpoint shut.
  metrics:
    token: ${APP_METRICS_TOKEN:}
