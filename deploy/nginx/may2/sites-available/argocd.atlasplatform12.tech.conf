# Giao diện Argo CD (máy 2). nginx là cửa vào: certbot thêm HTTPS vào file này; Argo CD chạy HTTP trong cụm
# (server.insecure: true) qua Service IP cố định 10.43.0.81 (deploy/k8s/platform/argocd-edge-service.yaml).
server {
    server_name argocd.atlasplatform12.tech;

    location / {
        proxy_pass http://10.43.0.81;
        proxy_http_version 1.1;
        # Giữ tên miền và IP thật của người dùng cho Argo CD (link chuyển hướng SSO, log truy cập)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Giao diện nhận cập nhật trực tiếp (stream) và CLI dùng gRPC-web: cần kết nối dài, không đệm
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/argocd.atlasplatform12.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/argocd.atlasplatform12.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = argocd.atlasplatform12.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name argocd.atlasplatform12.tech;
    return 404; # managed by Certbot


}