# Site RMS trên máy 1: /etc/nginx/sites-available/rms.atlasplatform12.tech.conf (bật bằng symlink trong sites-enabled).
#
# Vai trò: nginx là edge mỏng, chỉ làm việc gắn với máy và mạng (quản lý tay, ngoài cụm):
#   - nhận HTTPS (chứng chỉ Let's Encrypt do certbot gia hạn), chuyển http -> https, HTTP/2, HSTS
#   - giới hạn tần suất đăng nhập theo IP (zone rms_login, deploy/nginx/may1/conf.d/rms-login-ratelimit.conf)
#   - chuyển MỌI request vào Traefik của k3s (ClusterIP cố định 10.43.0.80, xem deploy/k8s/platform/may1/traefik-config.yaml)
# Định tuyến /api, / và các header, nén của ứng dụng do Traefik làm theo Ingress + Middleware trong Git (GitOps):
# deploy/k8s/overlays/prod/ingress.yaml, middlewares.yaml. Không thêm định tuyến ứng dụng vào file này.
#
# Áp dụng: sudo cp ... /etc/nginx/sites-available/ && sudo nginx -t && sudo systemctl reload nginx (không gián đoạn)

upstream k3s_traefik {
    server 10.43.0.80:80;
    # Giữ sẵn kết nối tới Traefik, không mở TCP mới cho mỗi request (cần proxy_http_version 1.1 + Connection "")
    keepalive 32;
}

server {
    server_name rms.atlasplatform12.tech;

    listen 443 ssl http2;        # managed by Certbot (thêm http2)
    listen [::]:443 ssl http2;   # managed by Certbot (thêm http2)
    ssl_certificate /etc/letsencrypt/live/rms.atlasplatform12.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rms.atlasplatform12.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot (TLS 1.2/1.3)
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Không lộ phiên bản nginx trong header Server và trang lỗi
    server_tokens off;
    # Trình duyệt chỉ dùng HTTPS cho domain này trong 1 năm (không gồm subdomain khác)
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # Chống dò mật khẩu theo IP: 5 lần/phút, dồn thêm 5, vượt thì 429. Lớp thứ hai là bộ đếm theo tên đăng nhập
    # trong app (bảng login_throttles, dùng chung cho mọi bản app).
    location = /api/auth/login {
        limit_req zone=rms_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://k3s_traefik;
    }

    location / {
        proxy_pass http://k3s_traefik;
    }
}

server {
    if ($host = rms.atlasplatform12.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name rms.atlasplatform12.tech;
    server_tokens off;
    return 404; # managed by Certbot
}
