# Máy 2: /etc/nginx/sites-available/loki-wireguard.conf (symlink sang sites-enabled).
# Nhận log từ Alloy trên cụm máy 1 (10.10.0.1, qua WireGuard) và chuyển vào Loki 127.0.0.1:3100.
# Chỉ mở đúng đường dẫn ghi log; đọc log chỉ qua Grafana. ufw không mở 3101 ra internet.
server {
    listen 3101;
    allow 10.10.0.1;
    deny all;
    client_max_body_size 10m;
    location = /loki/api/v1/push {
        proxy_pass http://127.0.0.1:3100;
    }
    location / { return 404; }
}
