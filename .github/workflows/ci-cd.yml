name: CI/CD

# Branches: feature/* --PR--> develop --PR--> main.
# develop deploys to staging automatically; main deploys to production after approval.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # "Run workflow" button in the Actions tab: runs the tests only (no images, no deploy).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on GitHub runners).
      - name: Build and test
        run: ./mvnw -B verify
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend - lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Pushes to main get the moving tag "latest", pushes to develop get "develop"; every image also
  # gets the commit sha, which is what the deploy job runs.
  images:
    name: Build and push images
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHANNEL: ${{ github.ref_name == 'main' && 'latest' || 'develop' }}
    steps:
      - uses: actions/checkout@v7
      - name: GHCR needs a lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/rms-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/rms-backend:${{ env.CHANNEL }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/rms-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/rms-frontend:${{ env.CHANNEL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # develop → environment "staging" (no approval), main → environment "production" (add required
  # reviewers in GitHub settings). Each environment holds its own DEPLOY_* secrets and PUBLIC_URL.
  # Nothing is deployed until the repository variable DEPLOY_ENABLED is "true".
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: images
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ github.ref_name == 'main' && 'bnn-rms' || 'bnn-rms-staging' }}
    steps:
      - uses: actions/checkout@v7
      - name: GHCR needs a lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Copy compose file to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: ${{ env.APP_DIR }}
          strip_components: 1
      - name: Pull the new images and restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE_TAG=${{ github.sha }} GHCR_OWNER=${{ env.OWNER }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker logout ghcr.io
            docker image prune -f
      - name: Check the new version answers
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "${{ vars.PUBLIC_URL }}/actuator/health"; then exit 0; fi
            sleep 5
          done
          echo "Health check failed. Roll back: re-run this job from the last good run." >&2
          exit 1
