# P0-08: the whole Jenkins setup, applied at every start (docs-core/11 section 11.11). Secrets come from
# ~/monitoring/.env through the environment, and the SSH key of the deploy user from the file mounted at
# /run/secrets/app_server_key. Nothing is set up by hand in the web page.
jenkins:
  systemMessage: "Khói Bếp: Jenkins deploy chính (P0-08). Jenkins không trả lời thì GitHub Actions deploy thay."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: APP_SERVER_HOST
            value: "${APP_SERVER_HOST}"
          - key: GHCR_OWNER
            value: "${GHCR_OWNER}"
          - key: SITE_URL_PRODUCTION
            value: "${SITE_URL_PRODUCTION}"
          - key: SITE_URL_STAGING
            value: "${SITE_URL_STAGING}"

unclassified:
  location:
    url: "https://${JENKINS_DOMAIN}/"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github
              description: "GitHub: trạng thái commit, đẩy image lên GHCR"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: app-server
              description: "deploy@máy ứng dụng"
              username: deploy
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/app_server_key}"

# One multibranch job over the public repository: develop deploys staging, main deploys production. Jenkins looks
# for new commits every 2 minutes, so GitHub needs no webhook and no way into this server.
jobs:
  - script: |
      multibranchPipelineJob('khoibep-cd') {
        displayName('Khói Bếp: deploy')
        branchSources {
          git {
            id('khoibep-rms')
            remote('https://github.com/Anpham120/restaurant-management-system.git')
            includes('develop main')
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('2m')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(5)
          }
        }
      }
