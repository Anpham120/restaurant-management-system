# Luật cảnh báo. Prometheus lấy số liệu mỗi 15 giây (scrape_interval) và đánh giá luật mỗi 1 phút (evaluation_interval
# mặc định). "for" là thời gian phải vi phạm liên tục mới bắn,
# để tránh báo nhầm khi app khởi động lại (deploy) vài chục giây.
groups:
  # Nhịp tim (dead man's switch): luôn bật. Alertmanager gửi nó ra healthchecks.io mỗi phút (receiver heartbeat).
  # Prometheus, Alertmanager, mạng hoặc cả máy chủ chết thì nhịp tim dừng, healthchecks.io báo qua Telegram/email.
  - name: meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "Nhịp tim giám sát (luôn bật, không phải sự cố)"

  - name: rms
    rules:
      - alert: AppDown
        # Hai slot blue-green: chỉ báo khi KHÔNG slot nào phản hồi (slot đang dừng luôn up = 0)
        expr: max(up{job="rms-app"}) == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Ứng dụng RMS không phản hồi"
          description: "Prometheus không lấy được số liệu từ app trong hơn 1 phút."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Tỉ lệ lỗi 5xx trên 5%"
          description: "Hơn 5% request trả lỗi máy chủ trong 5 phút gần nhất."

      - alert: JvmHeapHigh
        # Tính riêng từng slot. Mẫu số chỉ lấy vùng có giới hạn (G1 Eden/Survivor báo max = -1; Old Gen max = -Xmx)
        expr: |
          sum by (instance) (jvm_memory_used_bytes{area="heap"})
            / sum by (instance) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Bộ nhớ heap JVM trên 90%"
          description: "App có thể sắp hết bộ nhớ (rò rỉ hoặc tải cao)."

      - alert: DatabaseUnreachable
        # App chờ hết connectionTimeout của Hikari (30 giây) mà không lấy được kết nối PostgreSQL: DB dừng, sai mật khẩu
        # sau khi đổi credential, hoặc pool cạn. App vẫn sống nên AppDown không bắt được. Không cần người dùng truy cập:
        # healthcheck của compose (10 giây/lần) và blackbox (30 giây/lần) đều gọi /actuator/health, health kiểm DB.
        # Đã thử: dừng DB của một stack thử, counter tăng từ lần gọi health đầu tiên; bật lại DB, app tự kết nối lại.
        # increase() chịu được counter về 0 khi app khởi động lại (deploy).
        expr: sum(increase(hikaricp_connections_timeout_total{job="rms-app"}[2m])) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Ứng dụng không kết nối được database"
          description: "Hikari không lấy được kết nối PostgreSQL trong 2 phút gần nhất: kiểm container db (docker ps), mật khẩu DB_APP_PASSWORD, số kết nối."

  # Kiểm từ phía người dùng (blackbox-exporter gọi domain thật mỗi 30 giây)
  - name: site
    rules:
      - alert: SiteDown
        expr: probe_success{job="site"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Người dùng không vào được {{ $labels.instance }}"
          description: "Gọi qua domain thật (nginx + HTTPS) thất bại hơn 2 phút: database chết (health DOWN), nginx, DNS hoặc chứng chỉ lỗi."

      - alert: CertExpiringSoon
        expr: (min by (instance) (probe_ssl_earliest_cert_expiry{job=~"site|tool"}) - time()) / 86400 < 14
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Chứng chỉ HTTPS còn dưới 14 ngày"
          description: "certbot chưa gia hạn được chứng chỉ của {{ $labels.instance }} (rms: máy 1; argocd, grafana, jenkins: máy 2). Kiểm: sudo certbot renew --dry-run; systemctl status certbot.timer"

      - alert: ProbeExporterDown
        expr: up{job="site"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "blackbox-exporter không phản hồi"
          description: "Không kiểm được domain từ phía người dùng (SiteDown sẽ không báo được)."

  # Sao lưu: backup-db.sh và offsite-backup.sh ghi thời điểm thành công vào textfile collector của node-exporter
  - name: backup
    rules:
      - alert: BackupStale
        expr: |
          (time() - rms_backup_last_success_timestamp_seconds{kind="daily"}) > 26 * 3600
            or absent(rms_backup_last_success_timestamp_seconds{kind="daily"})
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "Quá 26 giờ không có bản sao lưu database mới"
          description: "Cron backup-db.sh daily (02:30 giờ VN) không chạy hoặc lỗi. Xem /home/coder/rms-backups/backup.log"

      - alert: OffsiteBackupStale
        expr: |
          (time() - rms_backup_last_success_timestamp_seconds{kind="offsite"}) > 26 * 3600
            or absent(rms_backup_last_success_timestamp_seconds{kind="offsite"})
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Quá 26 giờ chưa gửi bản sao lưu ra ngoài máy chủ"
          description: "Cron offsite-backup.sh (02:35 giờ VN) lỗi: thiếu khóa, token Telegram hoặc mạng. Xem /home/coder/rms-backups/backup.log"

      # Sao lưu liên tục (CloudNativePG + barman-cloud lên SeaweedFS máy 2). Báo khi lần đẩy WAL GẦN NHẤT thất bại và
      # cứ thế suốt 5 phút. Không dùng "có lỗi trong 15 phút": lúc chuyển primary, lần đẩy đầu file .history có thể lỗi
      # thoáng qua rồi PostgreSQL tự thử lại thành công (thử ngày 20/11/2026). Không dùng "thời gian từ lần đẩy cuối":
      # DB rảnh thì không có WAL mới, số đó tăng mà không phải lỗi.
      - alert: WalArchivingFailing
        expr: cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Đẩy WAL lên kho sao lưu bị lỗi"
          description: "PostgreSQL không đẩy được WAL lên SeaweedFS (máy 2): không khôi phục được tới thời điểm gần nhất. Xem kubectl -n rms-prod logs rms-db-1 -c plugin-barman-cloud."

      - alert: PostgresExporterDown
        expr: up{job="cnpg"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Mất số liệu PostgreSQL"
          description: "Không đọc được số liệu CloudNativePG (cổng 9182 máy 1), không theo dõi được sao lưu WAL."

      # Khóa Sealed Secrets: mất khóa thì mọi SealedSecret trong Git vô dụng. Cron hằng tuần (scripts/backup-sealed-key.sh).
      - alert: SealedKeyBackupStale
        expr: |
          (time() - rms_backup_last_success_timestamp_seconds{kind="sealed-key"}) > 8 * 86400
            or absent(rms_backup_last_success_timestamp_seconds{kind="sealed-key"})
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Quá 8 ngày chưa sao lưu khóa Sealed Secrets"
          description: "Cron backup-sealed-key.sh (Chủ nhật 02:40 giờ VN, máy 1) không chạy hoặc lỗi. Xem /home/coder/rms-backups/backup.log"

  # GitOps: Argo CD (máy 2) đồng bộ Git vào 2 cụm. Lỗi ở đây không làm build Jenkins đỏ nếu xảy ra ngoài pipeline.
  - name: gitops
    rules:
      - alert: ArgoCDDown
        expr: up{job="argocd"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Mất số liệu Argo CD"
          description: "Không đọc được application controller (10.43.0.82:8082, cụm máy 2): Argo CD có thể đã ngừng đồng bộ."

      - alert: ArgoAppOutOfSync
        expr: argocd_app_info{sync_status!="Synced"} == 1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} lệch Git quá 15 phút"
          description: "Argo CD không đưa {{ $labels.name }} về đúng Git. Xem giao diện Argo CD hoặc: kubectl -n argocd get application {{ $labels.name }}"

      - alert: ArgoAppUnhealthy
        expr: argocd_app_info{health_status!="Healthy"} == 1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} không Healthy quá 15 phút ({{ $labels.health_status }})"
          description: "Tài nguyên của {{ $labels.name }} hỏng hoặc kẹt Progressing (Rollout không qua kiểm tra, pod lỗi)."

      - alert: ArgoSyncFailed
        expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Argo CD đồng bộ {{ $labels.name }} thất bại"
          description: "Lần đồng bộ gần đây lỗi (manifest sai, thiếu quyền, webhook admission từ chối). Argo CD sẽ thử lại."

      # Webhook GitHub hỏng thì Argo CD chỉ thấy commit mới khi tự quét Git (chậm tới 2 phút), không gì khác báo lỗi.
      # Số liệu do cron máy 2 ghi (scripts/argocd-webhook-metric.sh).
      - alert: ArgoWebhookRejected
        expr: |
          rms_argocd_webhook_rejected_10m > 0
            or (time() - rms_argocd_webhook_check_timestamp_seconds) > 1800
            or absent(rms_argocd_webhook_check_timestamp_seconds)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Webhook GitHub tới Argo CD bị từ chối hoặc không kiểm được"
          description: "Sai secret HMAC (sửa: chạy lại set-argocd-webhook-secret.sh trong terminal riêng rồi cập nhật webhook trên GitHub), hoặc cron argocd-webhook-metric.sh máy 2 ngừng."

      - alert: ToolDown
        expr: probe_success{job="tool"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Công cụ không truy cập được: {{ $labels.instance }}"
          description: "Argo CD, Grafana hoặc Jenkins (máy 2) không trả 200 qua HTTPS. Production không bị ảnh hưởng."

  - name: host
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Mất số liệu máy chủ {{ $labels.instance }}"
          description: "node-exporter không phản hồi, không theo dõi được CPU, RAM, ổ đĩa."

      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Ổ đĩa {{ $labels.instance }} còn dưới 15%"
          description: "Phân vùng gốc sắp đầy, pipeline và database có thể lỗi."

      - alert: HighMemory
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "RAM {{ $labels.instance }} trên 90%"
          description: "RAM khả dụng thấp liên tục trong 10 phút."

      - alert: HighCpu
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "CPU {{ $labels.instance }} trên 90%"
          description: "CPU quá tải liên tục trong 10 phút."
