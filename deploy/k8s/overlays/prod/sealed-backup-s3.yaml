# Khóa S3 (SeaweedFS máy 2) cho plugin barman-cloud. Mã hóa bằng chứng chỉ Sealed Secrets của cụm máy 1 (certs/prod.pem): chỉ cụm đó giải mã được.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rms-backup-s3
  namespace: rms-prod
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      name: rms-backup-s3
      namespace: rms-prod
